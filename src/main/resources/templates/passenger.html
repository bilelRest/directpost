<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dépôt Passager - National</title>
</head>
<body>
<div layout:fragment="content1">
    <div class="container-fluid mb-0 p-0">
   <form autocomplete="off" id="deliveryForm" class="w-100">
    <div class="card shadow-sm border-0 mb-2 border-start border-primary border-4">
        <div class="card-header border-0 py-1 bg-primary d-flex align-items-center">
            <h6 class="mb-0 text-light fw-bold" style="font-size: 0.8rem;"><i class="bi bi-person-up me-1"></i>EXPÉDITEUR PASSAGER</h6>
        </div>
        <div class="card-body py-2">
            <div class="row g-1 align-items-end">
                <div class="col-md-1">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">TÉLÉPHONE</label>
                    <input onchange="checkclient()" id="senderTel" name="sender.sendTel" type="tel" class="form-control form-control-sm border-primary border-opacity-25" placeholder="5x..." required />
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">NOM COMPLET</label>
                    <input id="senderName" name="sender.sendName" type="text" class="form-control form-control-sm border-primary border-opacity-25" placeholder="Nom & Prénom" required />
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">RAISON SOCIALE</label>
                    <input id="sendSocialReason" name="sender.sendSocialReason" type="text" class="form-control form-control-sm border-primary border-opacity-25" placeholder="Optionnel" />
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">ADRESSE</label>
                    <input id="senderAdress" name="sender.adress" type="text" class="form-control form-control-sm border-primary border-opacity-25" placeholder="Rue..." required />
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">VILLE</label>
                    <input id="senderVille" name="sender.ville" type="text" class="form-control form-control-sm border-primary border-opacity-25" placeholder="Ville" required />
                </div>
                <div class="col-md-1">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">CP</label>
                    <input id="senderPostal" name="sender.postalCode" type="text" class="form-control form-control-sm border-primary border-opacity-25" placeholder="CP" />
                </div>
                <div class="col-md-1">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">PAYS</label>
                    <input value="Tunisie" id="senderCountry" name="sender.country" type="text" class="form-control form-control-sm bg-light border-0" readonly />
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-2 border-start border-warning border-4">
        <div class="card-header border-0 py-1 bg-warning d-flex align-items-center">
            <h6 class="mb-0 text-dark fw-bold" style="font-size: 0.8rem;"><i class="bi bi-person-down me-1 text-success"></i>DESTINATAIRE</h6>
        </div>
        <div class="card-body py-2">
            <div class="row g-1 align-items-end">
                <div class="col-md-2">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">NOM COMPLET</label>
                    <input id="receiverName" name="receiver.recName" type="text" class="form-control form-control-sm border-warning border-opacity-50" placeholder="Nom & Prénom" required />
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">RAISON SOCIALE</label>
                    <input id="recSocialraison" name="receiver.recSocialraison" type="text" class="form-control form-control-sm border-warning border-opacity-50" placeholder="Optionnel" />
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">ADRESSE</label>
                    <input id="receiverAdress" name="receiver.adress" type="text" class="form-control form-control-sm border-warning border-opacity-50" placeholder="Adresse..." required />
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">VILLE</label>
                    <input id="receiverVille" name="receiver.ville" type="text" class="form-control form-control-sm border-warning border-opacity-50" placeholder="Ville" required />
                </div>
                <div class="col-md-1">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">TÉLÉPHONE</label>
                    <input id="receiverTel" name="receiver.recTel" type="tel" class="form-control form-control-sm border-warning border-opacity-50" placeholder="9x..." required />
                </div>
                <div class="col-md-1">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">CP</label>
                    <input id="receiverPostal" name="receiver.postalCode" type="text" class="form-control form-control-sm border-warning border-opacity-50" placeholder="CP" />
                </div>
                <div class="col-md-1">
                    <label class="small fw-bold text-muted mb-0" style="font-size: 0.6rem;">PAYS</label>
                    <select id="recCountry" name="receiver.country" class="form-select form-select-sm bg-light border-0 shadow-none">
                        <option value="Tunisie" selected>Tunisie</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm bg-light mb-2">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <div class="btn-group w-100 shadow-sm">
                        <input type="radio" class="btn-check" name="btnradio" id="btncheck1" value="EMS National" checked onchange="toggleExtraFields()">
                        <label class="btn btn-outline-primary btn-sm fw-bold" for="btncheck1">EMS NAT</label>
                        <input type="radio" class="btn-check" name="btnradio" id="btncheck2" value="EMS International" onchange="toggleExtraFields()">
                        <label class="btn btn-outline-info btn-sm fw-bold" for="btncheck2">EMS INT</label>
                        <input type="radio" class="btn-check" name="btnradio" id="btncheck3" value="RPPI" onchange="toggleExtraFields()">
                        <label class="btn btn-outline-warning btn-sm fw-bold text-dark" for="btncheck3">RPPI</label>
                        <input type="radio" class="btn-check" name="btnradio" id="btncheck4" value="Bouquet de fleurs" onchange="toggleExtraFields()">
                        <label class="btn btn-outline-success btn-sm fw-bold" for="btncheck4">FLEURS</label>
                    </div>
                </div>

                <div class="col-md-2 d-none" id="typeContainer">
                    <select id="itemType" class="form-select form-select-sm border-info" onchange="toggleExtraFields()">
                        <option value="Document">Document</option>
                        <option value="Marchandise">Marchandise</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <div class="input-group input-group-sm">
                        <input oninput="calculerprix()" type="number" step="0.1" id="parcelWeight" class="form-control border-primary fw-bold" placeholder="Poids KG">
                        <span class="input-group-text bg-primary text-white border-primary">KG</span>
                    </div>
                </div>

                <div class="col-md-3 d-flex align-items-center justify-content-end text-end">
                    <span id="pricezone" class="fw-bold fs-5 text-primary me-2">0.000 DT</span>
                    <button type="button" class="btn btn-success btn-sm px-3 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#paymentModal">VALIDER</button>
                </div>
            </div>

            <div class="row g-2 mt-2 d-none" id="extraFieldsRow">
                <div class="col-md-6 d-none" id="invoiceMessageContainer">
                    <label class="small fw-bold text-muted" style="font-size: 0.6rem;">DONNÉES FACTURE / CONTENU</label>
                    <input type="text" class="form-control form-control-sm border-info" placeholder="Description de la marchandise...">
                </div>
                <div class="col-md-6 d-none" id="dimensionsContainer">
                    <label class="small fw-bold text-muted d-block" style="font-size: 0.6rem;">DIMENSIONS (CM) POUR POIDS VOLUMÉTRIQUE</label>
                    <div class="d-flex gap-1">
                        <input id="longeur" type="number" class="form-control form-control-sm" placeholder="Long." oninput="calculerprix()">
                        <input id="largeur" type="number" class="form-control form-control-sm" placeholder="Larg." oninput="calculerprix()">
                        <input id="hauteur" type="number" class="form-control form-control-sm" placeholder="Haut." oninput="calculerprix()">
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

        <div class="row mt-5" id="sessionContainer" style="display:none;">
            <div class="col-12">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-collection me-2 text-warning"></i>Session en cours</h5>
                        <span class="badge bg-primary px-3 py-2 fs-6" id="colisCount">0 Colis</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="sessionTable">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">N° Suivi</th>
                                        <th>Destinataire</th>
                                        <th>Poids</th>
                                        <th>Mode</th>
                                        <th>Prix</th>
                                        <th class="text-end pe-4">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    </tbody>
                                <tfoot class="table-light fw-bold">
                                    <tr>
                                        <td colspan="4" class="text-end ps-4">TOTAL SESSION :</td>
                                        <td id="totalSession" class="text-primary">0.000 DT</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer text-center py-3">
                        <button type="button" class="btn btn-success btn-lg px-5 shadow" onclick="imprimerBordereauFinal()">
                            <i class="bi bi-printer-fill me-2"></i>Imprimer le Bordereau de Session
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmation du dépôt</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Souhaitez-vous confirmer cet envoi ?
                </div>
                <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
    <button type="button" class="btn btn-success btn-lg" onclick="validerEtImprimer()">
        <i class="bi bi-printer me-2"></i> Valider et Imprimer l'étiquette
    </button>
</div>
            </div>
        </div>
    

    <script th:inline="javascript">
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    let sessionTotal = 0;
/**
 * Fonction principale : Enregistre, Imprime et Réinitialise le bloc Destinataire
 */
async function validerEtImprimer() {
    // 1. Récupération et vérification du poids/prix
    const weightInput = document.getElementById('parcelWeight');
    const weight = parseFloat(weightInput.value) || 0;

    if (weight <= 0 || weight > 30) {
        alert("Veuillez entrer un poids valide pour le colis (max 30kg)");
        weightInput.focus();
        return;
    }

    // 2. Préparation des données du formulaire
    const form = document.getElementById('deliveryForm');
    const formData = new FormData(form);
    
    // On ajoute manuellement le mode de paiement si nécessaire
    formData.append('paymentMode', 'Espèces');

    try {
        // 3. Persistance des données (Envoi au serveur)
        const response = await fetch('/passenger/reserve', { 
            method: 'POST', 
            body: formData 
        });

        if (!response.ok) {
            throw new Error(`Erreur serveur: ${response.status}`);
        }

        // Récupération du N° de suivi généré par le serveur
        const trackingId = await response.text(); 

        // 4. Fermeture de la Modal Bootstrap
        const modalElement = document.getElementById('paymentModal');
        if (modalElement) {
            const modalInstance = bootstrap.Modal.getOrCreateInstance(modalElement);
            modalInstance.hide();
        }

        // 5. Lancement de l'impression de l'étiquette
        genererVueEtiquette(trackingId);

        // 6. Notification de succès
        showNotification(`Colis ${trackingId} enregistré avec succès !`, 'success');

        // 7. --- RÉINITIALISATION DU BLOC DESTINATAIRE UNIQUEMENT ---
        // Liste exacte des IDs basée sur votre code HTML
        const fieldsToClear = [
            'receiverName',      // Nom complet
            'recSocialraison',   // Raison sociale
            'receiverAdress',    // Adresse
            'receiverTel',       // Numéro de Téléphone
            'receiverVille',     // Ville
            'receiverPostal',    // Code Postal
            'parcelWeight'       // Poids du colis
        ];

        fieldsToClear.forEach(id => {
            const field = document.getElementById(id);
            if (field) {
                field.value = ""; // Vide la valeur
                field.classList.remove('is-valid', 'is-invalid'); // Nettoie les styles Bootstrap
            }
        });

        // Nettoyage de l'affichage du prix
        const priceZone = document.getElementById('pricezone');
        if (priceZone) priceZone.innerText = "";

        // 8. Mise à jour de la liste des colis en bas de page
        const senderTel = document.getElementById('senderTel').value;
        if (senderTel) {
            loadClientParcels(senderTel);
        }

        // 9. Focus automatique sur le champ téléphone du prochain destinataire
        setTimeout(() => {
            const nextInput = document.getElementById('receiverTel');
            if (nextInput) nextInput.focus();
        }, 500);

    } catch (err) {
        console.error("Erreur de processus:", err);
        showNotification("Erreur lors de l'enregistrement : " + err.message, 'error');
    }
}
function toggleExtraFields() {
    const service = document.querySelector('input[name="btnradio"]:checked').value;
    const type = document.getElementById('itemType').value;
    
    const typeContainer = document.getElementById('typeContainer');
    const extraFieldsRow = document.getElementById('extraFieldsRow');
    const dimensionsContainer = document.getElementById('dimensionsContainer');
    const invoiceContainer = document.getElementById('invoiceMessageContainer');

    // 1. Gestion du sélecteur Type (Document/Marchandise)
    // On l'affiche pour EMS International et RPPI
    if (service === 'EMS International' || service === 'RPPI') {
        typeContainer.classList.remove('d-none');
    } else {
        typeContainer.classList.add('d-none');
    }

    // 2. Gestion des champs auxiliaires selon le Type et le Service
    if (type === 'Marchandise') {
        if (service === 'EMS International') {
            extraFieldsRow.classList.remove('d-none');
            invoiceContainer.classList.remove('d-none'); // Affiche facture
            dimensionsContainer.classList.add('d-none');    // Cache dimensions
        } 
        else if (service === 'RPPI') {
            extraFieldsRow.classList.remove('d-none');
            invoiceContainer.classList.remove('d-none'); // Affiche facture
            dimensionsContainer.classList.remove('d-none'); // Affiche dimensions
        } 
        else {
            extraFieldsRow.classList.add('d-none');
        }
    } else {
        // Si c'est "Document", on cache tout le bloc de détails
        extraFieldsRow.classList.add('d-none');
    }

    calculerprix();
}

function calculerprix() {
    let poidsReel = parseFloat(document.getElementById('parcelWeight').value) || 0;
    const service = document.querySelector('input[name="btnradio"]:checked').value;
    const type = document.getElementById('itemType').value;
    
    // Poids volumétrique uniquement pour RPPI Marchandise
    if (service === 'RPPI' && type === 'Marchandise') {
        const l = parseFloat(document.getElementById('longeur').value) || 0;
        const w = parseFloat(document.getElementById('largeur').value) || 0;
        const h = parseFloat(document.getElementById('hauteur').value) || 0;
        if(l > 0 && w > 0 && h > 0) {
            const poidsVol = (l * w * h) / 5000;
            poidsReel = Math.max(poidsReel, poidsVol);
        }
    }

    let prix = 0;
    const tarifs = {
        'EMS National': { base: 7, kg: 1.5 },
        'EMS International': { base: 45, kg: 20 },
        'RPPI': { base: 18, kg: 10 },
        'Bouquet de fleurs': { base: 25, kg: 0 }
    };

    if (poidsReel > 0 || service === 'Bouquet de fleurs') {
        const t = tarifs[service];
        prix = t.base + (poidsReel * t.kg);
    }

    document.getElementById('pricezone').innerText = prix.toFixed(3) + " DT";
}

function calculerprix() {
    let poidsReel = parseFloat(document.getElementById('parcelWeight').value) || 0;
    const service = document.querySelector('input[name="btnradio"]:checked').value;
    const type = document.getElementById('itemType').value;
    
    // Logique Poids Volumétrique (RPPI Marchandise uniquement)
    if (service === 'RPPI' && type === 'Marchandise') {
        const l = parseFloat(document.getElementById('longeur').value) || 0;
        const w = parseFloat(document.getElementById('largeur').value) || 0;
        const h = parseFloat(document.getElementById('hauteur').value) || 0;
        const poidsVol = (l * w * h) / 5000;
        poidsReel = Math.max(poidsReel, poidsVol);
    }

    let prix = 0;
    const tarifs = {
        'EMS National': { base: 7, kg: 1.5 },
        'EMS International': { base: 45, kg: 20 },
        'RPPI': { base: 18, kg: 10 },
        'Bouquet de fleurs': { base: 25, kg: 0 }
    };

    if (poidsReel > 0 || service === 'Bouquet de fleurs') {
        const t = tarifs[service];
        prix = t.base + (poidsReel * t.kg);
    }

    document.getElementById('pricezone').innerText = prix.toFixed(3) + " DT";
}

    const sName = document.getElementById('senderName').value;
    const sTel = document.getElementById('senderTel').value;
    const rName = document.getElementById('receiverName').value;
    const rTel = document.getElementById('receiverTel').value;
    const rAddr = document.getElementById('receiverAdress').value;
    const rVille = document.getElementById('receiverVille').value;
    const weight = document.getElementById('parcelWeight').value;

    const printWindow = window.open('', '_blank', 'width=600,height=800');
    
    printWindow.document.write(`
        <html>
        <head>
            <title>Etiquette ${trackingId}</title>
            <style>
                @page { size: 100mm 150mm; margin: 0; }
                body { font-family: 'Arial', sans-serif; margin: 0; padding: 5mm; }

                .tracking-id { font-size: 24px; font-family: 'Courier New', monospace; font-weight: bold; }
                .footer { position: absolute; bottom: 5mm; width: 92%; display: flex; justify-content: space-between; font-size: 12px; }
            </style>
        </head>
        <body onload="window.print(); window.close();">
            <div class="label-card">
                <div class="header">
                    <h2 style="margin:0;">NATIONAL EXPRESS</h2>
                </div>
                <div class="section">
                    <span class="label">Expéditeur:</span>
                    <span class="value">${sName}</span>
                    <span class="value" style="font-weight:normal;">Tél: ${sTel}</span>
                </div>
                <div class="section dest-box">
                    <span class="label">Destinataire:</span>
                    <span class="value" style="font-size: 19px;">${rName}</span>
                    <span class="value">${rAddr}</span>
                    <span class="value">${rVille}</span>
                    <span class="value">Tél: ${rTel}</span>
                </div>
                <div class="tracking-area">
                    <div class="tracking-id">${trackingId}</div>
                    <div style="margin-top:2mm; letter-spacing: 5px;">|||||||||||||||||||||||||||||||||</div>

}
    window.checkclient = function() {
        const tel = document.getElementById('senderTel').value;
        if (tel.length < 8) return; 

        fetch('/client/check/sender?tel=' + encodeURIComponent(tel))
        .then(res => {
            if (!res.ok) throw new Error("Erreur serveur");
                return res.json();
        })
        .then(data => {
            if (data && data.sendName) { 
                console.log("Expéditeur trouvé :", data);
                document.getElementById('senderName').value = data.sendName;
                document.getElementById('senderAdress').value = data.adress;
                document.getElementById('senderPostal').value = data.postalCode;
                
                document.getElementById('senderName').classList.add('is-valid');
                setTimeout(() => document.getElementById('senderName').classList.remove('is-valid'), 2000);
                
                // Charger les colis non livrés de ce client
                loadClientParcels(tel);
            } else {
                console.log("Nouveau expéditeur (non trouvé)");
                document.getElementById('sessionContainer').style.display = 'none';
                document.querySelector('#sessionTable tbody').innerHTML = '';
                sessionTotal = 0;
                document.getElementById('totalSession').innerText = "0.000 DT";
                document.getElementById('colisCount').innerText = "0 Colis";
            }
        })
        .catch(err => console.error("Erreur fetch expéditeur:", err));
    };
    
    // Fonction pour charger les colis du client
    async function loadClientParcels(tel) {
        try {
            console.log("Chargement des colis pour le téléphone:", tel);
            
            const response = await fetch(`/client/check/parcel?tel=${encodeURIComponent(tel)}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const parcels = await response.json();
            console.log("Colis récupérés:", parcels);
            
            if (parcels && parcels.length > 0) {
                updateSessionTable(parcels);
                document.getElementById('sessionContainer').style.display = 'block';
            } else {
                document.getElementById('sessionContainer').style.display = 'none';
                document.querySelector('#sessionTable tbody').innerHTML = '';
                sessionTotal = 0;
                document.getElementById('totalSession').innerText = "0.000 DT";
                document.getElementById('colisCount').innerText = "0 Colis";
            }
            
        } catch (error) {
            console.error("Erreur lors du chargement des colis:", error);
            document.getElementById('sessionContainer').style.display = 'none';
        }
    }
    
    // Fonction pour mettre à jour le tableau de session
    function updateSessionTable(parcels) {
        const tbody = document.querySelector('#sessionTable tbody');
        tbody.innerHTML = '';
        
        let total = 0;
        let parcelCount = 0;
        
        parcels.forEach(parcel => {
            console.log("Traitement du colis:", parcel);
            
            // CORRECTION CRITIQUE: Le trackingNumber est un objet, pas une chaîne
            let trackingId = '';
            if (parcel.trackingNumber) {
                // Si trackingNumber a la méthode getFormattedParcelId()
                if (parcel.trackingNumber.formattedParcelId) {
                    trackingId = parcel.trackingNumber.formattedParcelId;
                }
                // Sinon, si c'est un objet avec parcelId, on le formate manuellement
                else if (parcel.trackingNumber.parcelId) {
                    trackingId = "EN" + String(parcel.trackingNumber.parcelId).padStart(9, '0') + "TN";
                }
                // Sinon, on essaie d'accéder directement aux propriétés
                else {
                    trackingId = JSON.stringify(parcel.trackingNumber); // Pour debug
                }
            } else if (parcel.trackingId) {
                trackingId = parcel.trackingId;
            } else if (parcel.id) {
                trackingId = "COLIS-" + parcel.id;
            }
            
            const receiverName = parcel.receiver ? 
                               (parcel.receiver.recName || parcel.receiver.fullName || '') : 
                               (parcel.receiverName || '');
            
            const weight = parcel.weight || parcel.poids || 0;
            const paymentMode = parcel.paymentMode || 
                              (parcel.modePaiement ? parcel.modePaiement : 'Espèces');
            const price = parcel.price || 
                         parcel.montant || 
                         (parcel.prix ? parseFloat(parcel.prix) : 0);
            
            const row = `
                <tr>
                    <td class="ps-4 fw-bold">${escapeHtml(trackingId)}</td>
                    <td>${escapeHtml(receiverName)}</td>
                    <td>${parseFloat(weight).toFixed(2)} KG</td>
                    <td><span class="badge bg-light text-dark border">${escapeHtml(paymentMode)}</span></td>
                    <td class="fw-bold text-primary">${parseFloat(price).toFixed(3)} DT</td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-secondary" 
                                onclick="window.open('/passenger/success?track=${escapeHtml(trackingId)}', '_blank', 'width=450,height=650')">
                            <i class="bi bi-printer"></i> Réimprimer
                        </button>
                    </td>
                </tr>`;
            
            tbody.insertAdjacentHTML('beforeend', row);
            total += parseFloat(price);
            parcelCount++;
        });
        
        // Mise à jour des totaux
        sessionTotal = total;
        document.getElementById('totalSession').innerText = total.toFixed(3) + " DT";
        document.getElementById('colisCount').innerText = parcelCount + " Colis";
    }
    
    // Fonction d'échappement HTML
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Calcul du prix selon le poids
    window.calculerprix = function() {
        const weight = parseFloat(document.getElementById('parcelWeight').value) || 0;
        let price = 0;
        if (weight > 0 && weight <= 0.5) price = 5;
        else if (weight <= 1) price = 7;
        else if (weight <= 2) price = 9;
        else if (weight <= 5) price = 10;
        else if (weight <= 7) price = 12;
        else if (weight <= 12) price = 14;
        else if (weight <= 17) price = 20;
        else if (weight <= 22) price = 25;
        else if (weight <= 27) price = 30;
        else if (weight <= 30) price = 35;

        const zone = document.getElementById('pricezone');
        if (weight > 30) zone.innerHTML = '<span class="text-danger">Max 30kg</span>';
        else if (weight > 0) zone.innerText = price.toFixed(3) + " DT";
        else zone.innerText = "";
        return price;
    };


    
    // Fonction pour afficher des notifications
    function showNotification(message, type = 'info') {
        const alertClass = {
            'success': 'alert-success',
            'error': 'alert-danger',
            'info': 'alert-info',
            'warning': 'alert-warning'
        }[type] || 'alert-info';
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert ${alertClass} alert-dismissible fade show position-fixed`;
        alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        document.body.appendChild(alertDiv);
        
        // Auto-dismiss after 5 seconds
        setTimeout(() => {
            if (alertDiv.parentNode) {
                alertDiv.remove();
            }
        }, 5000);
    }
// Aide pour éviter les injections XSS

async function imprimerBordereauFinal() {
    const senderTel = document.getElementById('senderTel').value;
    const senderName = document.getElementById('senderName').value || 'Non spécifié';
    const senderAdress = document.getElementById('senderAdress').value || '';

    if (!senderTel) {
        alert("Veuillez d'abord saisir le numéro de téléphone de l'expéditeur");
        return;
    }

    try {
        // 1. Récupération des données JSON depuis le serveur
        const response = await fetch(`/client/check/parcel?validate=true&tel=${encodeURIComponent(senderTel)}&format=print`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) throw new Error('Erreur lors de la récupération des colis');

        const parcels = await response.json();
        
        if (parcels.length === 0) {
            alert("Aucun colis trouvé pour cet expéditeur.");
            return;
        }

        // 2. Préparation du contenu du tableau et calcul des totaux
        let tableRowsHtml = '';
        let totalGeneral = 0;
        let totalPoids = 0;

        parcels.forEach(parcel => {
            // Extraction du Tracking ID
            let trackingId = parcel.trackingNumber?.formattedParcelId || 
                             parcel.trackingId || 
                             (parcel.id ? "COLIS-" + parcel.id : "N/A");

            const receiverName = parcel.receiver?.recName || parcel.receiverName || 'Inconnu';
            const weight = parseFloat(parcel.weight || parcel.poids || 0);
            const price = parseFloat(parcel.price || parcel.montant || parcel.prix || 0);
            const paymentMode = parcel.paymentMode || parcel.modePaiement || 'Espèces';

            totalGeneral += price;
            totalPoids += weight;

            tableRowsHtml += `
                <tr>
                    <td>${escapeHtml(trackingId)}</td>
                    <td>${escapeHtml(receiverName)}</td>
                    <td class="text-center">${weight.toFixed(2)} KG</td>
                    <td class="text-center">${escapeHtml(paymentMode)}</td>
                    <td class="text-end">${price.toFixed(3)} DT</td>
                </tr>`;
        });

        // 3. Génération de la fenêtre d'impression
        const printWin = window.open('', '_blank', 'width=900,height=700');
        printWin.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Bordereau de Session - ${senderName}</title>
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                <style>
                    body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; color: #333; }
                    .header-box { border-bottom: 3px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
                    .table thead { background-color: #f8f9fa !important; }
                    .total-section { background-color: #eee; font-weight: bold; }
                    .signature-box { margin-top: 50px; border-top: 1px solid #ccc; padding-top: 10px; }
                    @media print { .no-print { display: none; } }
                </style>
            </head>
            <body>
                <div class="container mt-4">
                    <div class="header-box text-center">
                        <h2 class="fw-bold">BORDEREAU DE SESSION</h2>
                        <div class="row mt-3">
                            <div class="col-6 text-start">
                                <strong>Expéditeur :</strong> ${escapeHtml(senderName)}<br>
                                <strong>Téléphone :</strong> ${senderTel}<br>
                                <strong>Adresse :</strong> ${escapeHtml(senderAdress)}
                            </div>
                            <div class="col-6 text-end">
                                <strong>Date :</strong> ${new Date().toLocaleDateString('fr-FR')}<br>
                                <strong>Heure :</strong> ${new Date().toLocaleTimeString('fr-FR')}<br>
                                <strong>Nombre de colis :</strong> ${parcels.length}
                            </div>
                        </div>
                    </div>

                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>N° Suivi</th>
                                <th>Destinataire</th>
                                <th class="text-center">Poids</th>
                                <th class="text-center">Paiement</th>
                                <th class="text-end">Montant</th>
                            </tr>
                        </thead>
                        <tbody>${tableRowsHtml}</tbody>
                        <tfoot>
                            <tr class="total-section">
                                <td colspan="2" class="text-end">TOTAL RÉCAPITULATIF</td>
                                <td class="text-center">${totalPoids.toFixed(2)} KG</td>
                                <td></td>
                                <td class="text-end">${totalGeneral.toFixed(3)} DT</td>
                            </tr>
                        </tfoot>
                    </table>

                    <div class="row mt-5">
                        <div class="col-6">
                            <p class="small text-muted">Bordereau généré électroniquement.</p>
                        </div>
                        <div class="col-6 text-end">
                            <p class="fw-bold">Signature et Cachet :</p>
                            <div style="height: 100px;"></div>
                            <p>_________________________</p>
                        </div>
                    </div>

                    <div class="text-center mt-4 no-print">
                        <button class="btn btn-primary" onclick="window.print()">Imprimer le Bordereau</button>
                        <button class="btn btn-secondary" onclick="window.close()">Fermer</button>
                    </div>
                </div>
            </body>
            </html>
        `);
        printWin.document.close();
        await checkDelivered();

    } catch (error) {
        console.error("Erreur critique :", error);
        alert("Impossible de générer le bordereau : " + error.message);
    }};
