<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dépôt Passager - National</title>
</head>
<body>
<div layout:fragment="content1">
    <div class="container my-5">
        <div class="row mb-5">
            <div class="col-12 text-center">
                <div class="display-6 fw-bold text-primary mb-2">
                    <i class="bi bi-box-seam me-2"></i>Dépôt Passager National
                </div>
                <p class="text-muted">Enregistrez vos envois session par session</p>
                <hr class="w-25 mx-auto border-primary opacity-50">
            </div>
        </div>

        <form autocomplete="off" id="deliveryForm">
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-light border-0 py-3 d-flex justify-content-between">
                            <h5 class="mb-0 text-dark fw-bold"><i class="bi bi-person-up me-2 text-primary"></i>Expéditeur</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Numéro de Téléphone</label>
                                <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" onchange="checkclient()" id="senderTel" name="sender.sendTel" type="tel" class="form-control" placeholder="5x xxx xxx" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom complet</label>
                                <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="senderName" name="sender.sendName" type="text" class="form-control" required />
                            </div>
                            <div class="row g-2">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label fw-semibold">Adresse</label>
                                    <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="senderAdress" name="sender.adress" type="text" class="form-control" required />
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Code Postal</label>
                                    <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="senderPostal" name="sender.postalCode" type="text" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-light border-0 py-3">
                            <h5 class="mb-0 text-dark fw-bold"><i class="bi bi-person-down me-2 text-success"></i>Destinataire</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Numéro de Téléphone</label>
                                <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="receiverTel" onchange="checkreceiver()" name="receiver.recTel" type="tel" class="form-control" placeholder="9x xxx xxx" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nom complet</label>
                                <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="receiverName" name="receiver.recName" type="text" class="form-control" required />
                            </div>
                            <div class="row g-2">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label fw-semibold">Adresse</label>
                                    <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="receiverAdress" name="receiver.adress" type="text" class="form-control" required />
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Code Postal</label>
                                    <input autocorrect="off" 
       autocapitalize="off" 
       spellcheck="false" autocomplete="off" id="receiverPostal" name="receiver.postalCode" type="text" class="form-control" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card border-primary shadow-sm" style="border-style: dashed; border-width: 2px;">
                        <div class="card-body py-4">
                            <div class="row align-items-center">
                                <div class="col-md-4">
                                    <h5 class="mb-0 fw-bold"><i class="bi bi-weight me-2"></i>Poids du colis (KG)</h5>
                                </div>
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <input autocomplete="off" oninput="calculerprix()" type="number" step="0.01" id="parcelWeight" name="weight" class="form-control form-control-lg" placeholder="0.00" required>
                                        <span class="input-group-text fw-bold bg-light">KG</span>
                                    </div>
                                </div>
                                <div class="col-md-4 text-center">
                                    <h5 id="pricezone" class="mb-0 text-primary fw-bold"></h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-5">
                <div class="col-12 text-center">
                    <button type="button" class="btn btn-outline-secondary btn-lg px-4 me-3" onclick="document.getElementById('deliveryForm').reset(); document.getElementById('pricezone').innerText=''">
                        <i class="bi bi-arrow-counterclockwise me-2"></i>Réinitialiser
                    </button>
                    <button type="button" class="btn btn-primary btn-lg px-5 shadow" data-bs-toggle="modal" data-bs-target="#paymentModal">
                        <i class="bi bi-check-circle me-2"></i>Valider ce colis
                    </button>
                </div>
            </div>
        </form>

        <div class="row mt-5" id="sessionContainer" style="display:none;">
            <div class="col-12">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-collection me-2 text-warning"></i>Session en cours</h5>
                        <span class="badge bg-primary px-3 py-2 fs-6" id="colisCount">0 Colis</span>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0" id="sessionTable">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">N° Suivi</th>
                                    <th>Destinataire</th>
                                    <th>Poids</th>
                                    <th>Mode</th>
                                    <th>Prix</th>
                                    <th class="text-end pe-4">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                            <tfoot class="table-light fw-bold">
                                <tr>
                                    <td colspan="4" class="text-end ps-4">TOTAL SESSION :</td>
                                    <td id="totalSession" class="text-primary">0.000 DT</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div class="card-footer text-center py-3">
                        <button type="button" class="btn btn-success btn-lg px-5 shadow" onclick="imprimerBordereauFinal()">
                            <i class="bi bi-printer-fill me-2"></i>Imprimer le Bordereau de Session
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Mode de Règlement</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 d-grid gap-3">
                    <button type="button" class="btn btn-outline-primary py-3 text-start" onclick="confirmPayment('Espèces')">
                        <i class="bi bi-cash-stack me-3"></i>Espèces
                    </button>
                    <button type="button" class="btn btn-outline-dark py-3 text-start" onclick="confirmPayment('Chèque')">
                        <i class="bi bi-card-checklist me-3"></i>Chèque
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    let sessionTotal = 0;
    
    window.checkreceiver = function() {
        const tel = document.getElementById('receiverTel').value;
        if (tel.length < 8) return; 

        fetch('/client/check/receiver?tel=' + encodeURIComponent(tel))
        .then(res => {
            if (!res.ok) throw new Error("Erreur serveur");
            return res.json();
        })
        .then(data => {
            if (data && data.recName) { 
                console.log("Destinataire trouvé :", data);
                document.getElementById('receiverName').value = data.recName;
                document.getElementById('receiverAdress').value = data.adress;
                document.getElementById('receiverPostal').value = data.postalCode;
                
                document.getElementById('receiverName').classList.add('is-valid');
                setTimeout(() => document.getElementById('receiverName').classList.remove('is-valid'), 2000);
            } else {
                console.log("Nouveau destinataire (non trouvé)");
            }
        })
        .catch(err => console.error("Erreur fetch destinataire:", err));
    };
    
    window.checkclient = function() {
        const tel = document.getElementById('senderTel').value;
        if (tel.length < 8) return; 

        fetch('/client/check/sender?tel=' + encodeURIComponent(tel))
        .then(res => {
            if (!res.ok) throw new Error("Erreur serveur");
                return res.json();
        })
        .then(data => {
            if (data && data.sendName) { 
                console.log("Expéditeur trouvé :", data);
                document.getElementById('senderName').value = data.sendName;
                document.getElementById('senderAdress').value = data.adress;
                document.getElementById('senderPostal').value = data.postalCode;
                
                document.getElementById('senderName').classList.add('is-valid');
                setTimeout(() => document.getElementById('senderName').classList.remove('is-valid'), 2000);
                
                // Charger les colis non livrés de ce client
                loadClientParcels(tel);
            } else {
                console.log("Nouveau expéditeur (non trouvé)");
                document.getElementById('sessionContainer').style.display = 'none';
                document.querySelector('#sessionTable tbody').innerHTML = '';
                sessionTotal = 0;
                document.getElementById('totalSession').innerText = "0.000 DT";
                document.getElementById('colisCount').innerText = "0 Colis";
            }
        })
        .catch(err => console.error("Erreur fetch expéditeur:", err));
    };
    
    // Fonction pour charger les colis du client
    async function loadClientParcels(tel) {
        try {
            console.log("Chargement des colis pour le téléphone:", tel);
            
            const response = await fetch(`/client/check/parcel?tel=${encodeURIComponent(tel)}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const parcels = await response.json();
            console.log("Colis récupérés:", parcels);
            
            if (parcels && parcels.length > 0) {
                updateSessionTable(parcels);
                document.getElementById('sessionContainer').style.display = 'block';
            } else {
                document.getElementById('sessionContainer').style.display = 'none';
                document.querySelector('#sessionTable tbody').innerHTML = '';
                sessionTotal = 0;
                document.getElementById('totalSession').innerText = "0.000 DT";
                document.getElementById('colisCount').innerText = "0 Colis";
            }
            
        } catch (error) {
            console.error("Erreur lors du chargement des colis:", error);
            document.getElementById('sessionContainer').style.display = 'none';
        }
    }
    
    // Fonction pour mettre à jour le tableau de session
    function updateSessionTable(parcels) {
        const tbody = document.querySelector('#sessionTable tbody');
        tbody.innerHTML = '';
        
        let total = 0;
        let parcelCount = 0;
        
        parcels.forEach(parcel => {
            console.log("Traitement du colis:", parcel);
            
            // CORRECTION CRITIQUE: Le trackingNumber est un objet, pas une chaîne
            let trackingId = '';
            if (parcel.trackingNumber) {
                // Si trackingNumber a la méthode getFormattedParcelId()
                if (parcel.trackingNumber.formattedParcelId) {
                    trackingId = parcel.trackingNumber.formattedParcelId;
                }
                // Sinon, si c'est un objet avec parcelId, on le formate manuellement
                else if (parcel.trackingNumber.parcelId) {
                    trackingId = "EN" + String(parcel.trackingNumber.parcelId).padStart(9, '0') + "TN";
                }
                // Sinon, on essaie d'accéder directement aux propriétés
                else {
                    trackingId = JSON.stringify(parcel.trackingNumber); // Pour debug
                }
            } else if (parcel.trackingId) {
                trackingId = parcel.trackingId;
            } else if (parcel.id) {
                trackingId = "COLIS-" + parcel.id;
            }
            
            const receiverName = parcel.receiver ? 
                               (parcel.receiver.recName || parcel.receiver.fullName || '') : 
                               (parcel.receiverName || '');
            
            const weight = parcel.weight || parcel.poids || 0;
            const paymentMode = parcel.paymentMode || 
                              (parcel.modePaiement ? parcel.modePaiement : 'Espèces');
            const price = parcel.price || 
                         parcel.montant || 
                         (parcel.prix ? parseFloat(parcel.prix) : 0);
            
            const row = `
                <tr>
                    <td class="ps-4 fw-bold">${escapeHtml(trackingId)}</td>
                    <td>${escapeHtml(receiverName)}</td>
                    <td>${parseFloat(weight).toFixed(2)} KG</td>
                    <td><span class="badge bg-light text-dark border">${escapeHtml(paymentMode)}</span></td>
                    <td class="fw-bold text-primary">${parseFloat(price).toFixed(3)} DT</td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-secondary" 
                                onclick="window.open('/passenger/success?track=${escapeHtml(trackingId)}', '_blank', 'width=450,height=650')">
                            <i class="bi bi-printer"></i> Réimprimer
                        </button>
                    </td>
                </tr>`;
            
            tbody.insertAdjacentHTML('beforeend', row);
            total += parseFloat(price);
            parcelCount++;
        });
        
        // Mise à jour des totaux
        sessionTotal = total;
        document.getElementById('totalSession').innerText = total.toFixed(3) + " DT";
        document.getElementById('colisCount').innerText = parcelCount + " Colis";
    }
    
    // Fonction d'échappement HTML
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Calcul du prix selon le poids
    window.calculerprix = function() {
        const weight = parseFloat(document.getElementById('parcelWeight').value) || 0;
        let price = 0;
        if (weight > 0 && weight <= 0.5) price = 5;
        else if (weight <= 1) price = 7;
        else if (weight <= 2) price = 9;
        else if (weight <= 5) price = 10;
        else if (weight <= 7) price = 12;
        else if (weight <= 12) price = 14;
        else if (weight <= 17) price = 20;
        else if (weight <= 22) price = 25;
        else if (weight <= 27) price = 30;
        else if (weight <= 30) price = 35;

        const zone = document.getElementById('pricezone');
        if (weight > 30) zone.innerHTML = '<span class="text-danger">Max 30kg</span>';
        else if (weight > 0) zone.innerText = price.toFixed(3) + " DT";
        else zone.innerText = "";
        return price;
    };

    function confirmPayment(mode) {
        const currentPrice = calculerprix();
        if (currentPrice === 0) { 
            alert("Veuillez entrer un poids valide (max 30kg)"); 
            return; 
        }
        
        // Validation des champs requis
        const requiredFields = ['senderTel', 'senderName', 'receiverTel', 'receiverName', 'receiverAdress'];
        for (const fieldId of requiredFields) {
            const field = document.getElementById(fieldId);
            if (!field.value.trim()) {
                alert(`Le champ "${field.previousElementSibling.textContent}" est requis`);
                field.focus();
                return;
            }
        }
        
        paymentModal.hide();
        const form = document.getElementById('deliveryForm');
        const formData = new FormData(form);
        formData.append('paymentMode', mode);

        const senderTel = document.getElementById('senderTel').value;

        fetch('/passenger/reserve', { 
            method: 'POST', 
            body: formData 
        })
        .then(res => {
            if (!res.ok) throw new Error(`Erreur HTTP: ${res.status}`);
            return res.text();
        })
        .then(trackingId => {
            console.log("Colis enregistré avec N° Suivi :", trackingId);
            
            // Afficher un message de succès
            showNotification(`Colis enregistré! N° Suivi: ${trackingId}`, 'success');
            
            // Imprimer le ticket automatiquement
            const ticketUrl = '/passenger/success?track=' + trackingId;
            window.open(ticketUrl, '_blank', 'width=450,height=650');

            // Recharger les colis du client après ajout
            if (senderTel) {
                setTimeout(() => {
                    loadClientParcels(senderTel);
                }, 1000);
            }

            // Reset seulement les champs destinataire et poids
            ['receiverTel', 'receiverName', 'receiverAdress', 'receiverPostal', 'parcelWeight'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('pricezone').innerText = '';
        })
        .catch(err => {
            console.error("Erreur:", err);
            showNotification("Erreur lors de l'enregistrement : " + err.message, 'error');
        });
    }
    
    // Fonction pour afficher des notifications
    function showNotification(message, type = 'info') {
        const alertClass = {
            'success': 'alert-success',
            'error': 'alert-danger',
            'info': 'alert-info',
            'warning': 'alert-warning'
        }[type] || 'alert-info';
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert ${alertClass} alert-dismissible fade show position-fixed`;
        alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        document.body.appendChild(alertDiv);
        
        // Auto-dismiss after 5 seconds
        setTimeout(() => {
            if (alertDiv.parentNode) {
                alertDiv.remove();
            }
        }, 5000);
    }

    // Fonction pour récupérer les données du serveur pour l'impression
    async function fetchTableRowDataForPrint(tel) {
        try {
            const response = await fetch(`/client/check/parcel?tel=${encodeURIComponent(tel)}&format=print`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (!response.ok) throw new Error('Erreur serveur');
            
            const parcels = await response.json();
            let html = '';
            
            // Générer les lignes à partir des données JSON
            parcels.forEach(parcel => {
                // Même logique pour extraire le trackingId
                let trackingId = '';
                if (parcel.trackingNumber) {
                    if (parcel.trackingNumber.formattedParcelId) {
                        trackingId = parcel.trackingNumber.formattedParcelId;
                    }
                    else if (parcel.trackingNumber.parcelId) {
                        trackingId = "EN" + String(parcel.trackingNumber.parcelId).padStart(9, '0') + "TN";
                    }
                } else if (parcel.trackingId) {
                    trackingId = parcel.trackingId;
                } else if (parcel.id) {
                    trackingId = "COLIS-" + parcel.id;
                }
                
                const receiverName = parcel.receiver ? 
                                   (parcel.receiver.recName || parcel.receiver.fullName || '') : 
                                   (parcel.receiverName || '');
                
                const weight = parcel.weight || parcel.poids || 0;
                const paymentMode = parcel.paymentMode || 
                                  (parcel.modePaiement ? parcel.modePaiement : 'Espèces');
                const price = parcel.price || 
                             parcel.montant || 
                             (parcel.prix ? parseFloat(parcel.prix) : 0);
                
                html += `<tr>
                    <td>${escapeHtml(trackingId)}</td>
                    <td>${escapeHtml(receiverName)}</td>
                    <td>${parseFloat(weight).toFixed(2)} KG</td>
                    <td>${escapeHtml(paymentMode)}</td>
                    <td>${parseFloat(price).toFixed(3)} DT</td>
                </tr>`;
            });
            
            return html;
        } catch (error) {
            console.error('Erreur:', error);
            return '<tr><td colspan="5">Erreur de chargement</td></tr>';
        }
    }

    async function imprimerBordereauFinal() {
        const senderTel = document.getElementById('senderTel').value;
        if (!senderTel) {
            alert("Veuillez d'abord saisir le numéro de téléphone de l'expéditeur");
            return;
        }
        
        try {
            const tableRowsHtml = await fetchTableRowDataForPrint(senderTel);
            
            const printWin = window.open('', '_blank', 'width=800,height=600');
            printWin.document.write(`
                <!DOCTYPE html>
                <html lang="fr">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Bordereau de Session</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                    <style>
                        @media print {
                            body { padding: 20px; }
                            .no-print { display: none; }
                            @page { margin: 20px; }
                        }
                        body { font-family: 'Arial', sans-serif; font-size: 12px; }
                        .header { border-bottom: 3px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
                        .total-row { font-weight: bold; background-color: #f8f9fa; }
                        table { width: 100%; border-collapse: collapse; }
                        th { background-color: #f2f2f2; padding: 8px; border: 1px solid #ddd; }
                        td { padding: 8px; border: 1px solid #ddd; }
                        .text-center { text-align: center; }
                        .text-end { text-align: right; }
                        .mb-3 { margin-bottom: 1rem; }
                        .mt-3 { margin-top: 1rem; }
                    </style>
                </head>
                <body>
                    <div class="container-fluid">
                        <div class="header text-center">
                            <h2>BORDEREAU DE SESSION</h2>
                            <h4>Expéditeur: ${escapeHtml(document.getElementById('senderName').value || 'Non spécifié')}</h4>
                            <p>Téléphone: ${senderTel} - Adresse: ${escapeHtml(document.getElementById('senderAdress').value || '')}</p>
                            <p>Date: ${new Date().toLocaleDateString('fr-FR')} - Heure: ${new Date().toLocaleTimeString('fr-FR')}</p>
                        </div>
                        
                        <table class="table table-bordered mb-3">
                            <thead class="table-light">
                                <tr>
                                    <th>N° Suivi</th>
                                    <th>Destinataire</th>
                                    <th>Poids (KG)</th>
                                    <th>Mode de paiement</th>
                                    <th>Montant (DT)</th>
                                </tr>
                            </thead>
                            <tbody>${tableRowsHtml}</tbody>
                            <tfoot>
                                <tr class="total-row">
                                    <td colspan="4" class="text-end"><strong>TOTAL GÉNÉRAL :</strong></td>
                                    <td><strong>${sessionTotal.toFixed(3)} DT</strong></td>
                                </tr>
                            </tfoot>
                        </table>
                        
                        <div class="mt-3">
                            <div class="row">
                                <div class="col-6">
                                    <p><strong>Nombre de colis:</strong> ${document.querySelectorAll('#sessionTable tbody tr').length}</p>
                                    <p><strong>Total poids:</strong> ${calculateTotalWeight()} KG</p>
                                </div>
                                <div class="col-6 text-end">
                                    <p><strong>Signature :</strong></p>
                                    <p style="margin-top: 80px;">_________________________</p>
                                    <p>Cachet et signature</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4 no-print">
                            <button class="btn btn-primary btn-sm me-2" onclick="window.print()">
