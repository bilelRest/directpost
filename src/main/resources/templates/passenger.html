                </div>
                <div class="modal-body">
                    Souhaitez-vous confirmer cet envoi ?
                </div>
                <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>

    <script th:inline="javascript">
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    let sessionTotal = 0;
/**
 * Fonction principale : Enregistre, Imprime et Réinitialise le bloc Destinataire
 */
/**
 * Fonction principale : Enregistre, Imprime et Réinitialise
 */
async function validerEtImprimer() {
    const weightInput = document.getElementById('parcelWeight');
    const weight = parseFloat(weightInput.value) || 0;
    const serviceActif = document.querySelector('input[name="btnradio"]:checked').value;

    // Validation du poids (sauf pour les fleurs qui peuvent être à 0)
    if (serviceActif !== 'Bouquet de fleurs' && (weight <= 0 || weight > 30)) {
        alert("Veuillez entrer un poids valide (max 30kg)");
        weightInput.focus();
        return;
    }

    // VALIDATION SPÉCIFIQUE : S'assurer qu'un prix a été calculé
    const priceHiddenField = document.getElementById('parcelPrice');
    const priceValue = parseFloat(priceHiddenField.value) || 0;
    
    if (priceValue <= 0) {
        alert("Veuillez d'abord calculer le prix en saisissant/changant le poids (KG)");
        weightInput.focus();
        return;
    }

    const form = document.getElementById('deliveryForm');
    const formData = new FormData(form);
    
    // --- RÉCUPÉRATION DES DONNÉES DU MODAL FACTURE ---
    const factDetail = document.getElementById('factureDetail');
    const factVal = document.getElementById('factureVal');
    if (factDetail) formData.append('invoiceDetails', factDetail.value);
    if (factVal) formData.append('invoiceValue', factVal.value);

    // --- AJOUTS SÉCURISÉS DES SERVICES ---
    formData.append('service', serviceActif);
    formData.append('paymentMode', 'Espèces');
    
    // CORRECTION ICI : Utiliser le champ caché au lieu du span
    formData.append('calculatedPrice', priceValue.toFixed(3));
    
    // DEBUG : Afficher toutes les données envoyées
    console.log("=== DONNÉES ENVOYÉES AU BACKEND ===");
    for (let [key, value] of formData.entries()) {
        console.log(`${key}: ${value}`);
    }
    console.log("Prix envoyé (depuis champ caché):", priceValue);

    try {
        console.log("Envoi en cours...");
        const response = await fetch('/passenger/reserve', { 
            method: 'POST', 
            body: formData 
        });

        if (!response.ok) throw new Error(`Erreur serveur: ${response.status}`);

        const trackingId = await response.text(); 

        // 1. Notifications et Étiquette
        genererVueEtiquette(trackingId);
        showNotification(`Colis ${trackingId} enregistré avec succès !`, 'success');

        // 2. RÉINITIALISATION DES CHAMPS DESTINATAIRE UNIQUEMENT
        const fieldsToClear = [
            'receiverName', 'recSocialraison', 'receiverAdress', 
            'receiverTel', 'receiverVille', 'receiverPostal', 
            'parcelWeight', 'longeur', 'largeur', 'hauteur', 'recCountry', 'receiverMail',
            'factureDetail', 'factureVal'
        ];

        fieldsToClear.forEach(id => {
            const field = document.getElementById(id);
            
            if (field && field.tagName === 'SELECT' && id === 'recCountry') {
                // Pour un select, on recherche l'option avec selected
                const defaultOption = field.querySelector('option[selected]');
                if (defaultOption) {
                    field.value = defaultOption.value;
                } else {
                    // Si pas d'option selected, on prend la première
                    field.selectedIndex = 0;
                }
            } else if (field) {
                field.value = ""; 
            }
        });

        // IMPORTANT : Réinitialiser aussi le champ caché du prix
        if (document.getElementById('pricezone')) {
            document.getElementById('pricezone').innerText = "0.000 DT";
        }
        if (document.getElementById('parcelPrice')) {
            document.getElementById('parcelPrice').value = "0";
        }

        // 3. MISE À JOUR DU TABLEAU DE SESSION (LISTE DES COLIS EN BAS)
        const senderTel = document.getElementById('senderTel').value;
        if (senderTel) loadClientParcels(senderTel);

        // 4. Focus sur le téléphone du destinataire pour le suivant
        setTimeout(() => {
            const receiverTelField = document.getElementById('receiverTel');
            if (receiverTelField) receiverTelField.focus();
        }, 500);

    } catch (err) {
        console.error("Erreur critique:", err);
        showNotification("Erreur lors de l'enregistrement : " + err.message, 'danger');
    }
}// Fonction appelée au changement de pays
function toggleCountryLogic() {
    const country = document.getElementById('recCountry').value;
    const isTunisia = (country === 'Tunisie');

    // 1. Gestion de la visibilité des boutons radio
    const lblNat = document.getElementById('labelEmsNat');
    const lblFleurs = document.getElementById('labelFleurs');
    const lblInt = document.getElementById('labelEmsInt');
    const lblRppi = document.getElementById('labelRppi');

    if (isTunisia) {
        // Afficher options Nationales
      //  if(lblNat) lblNat.classList.remove('d-none');
       // if(lblFleurs) lblFleurs.classList.remove('d-none');
        // Cacher options Internationales
        if(lblInt) lblInt.classList.add('d-none');
        if(lblRppi) lblRppi.classList.add('d-none');

        // COCHÉ PAR DÉFAUT : EMS National
        const radioEmsNat = document.getElementById('btncheck1');
        if(radioEmsNat) radioEmsNat.checked = true;

    } else {
        // Cacher options Nationales
        if(lblNat) lblNat.classList.add('d-none');
        if(lblFleurs) lblFleurs.classList.add('d-none');
        // Afficher options Internationales
        if(lblInt) lblInt.classList.remove('d-none');
        if(lblRppi) lblRppi.classList.remove('d-none');

        // COCHÉ PAR DÉFAUT : RPPI
        const radioRppi = document.getElementById('btncheck3');
        if(radioRppi) radioRppi.checked = true;
    }
    
    // 2. Mettre à jour les champs supplémentaires (Doc/Marchandise/Dimensions)
    toggleExtraFields();
}
// Fonction de gestion des affichages de champs
function toggleExtraFields() {
    // 1. Récupération sécurisée des valeurs
    const radioChecked = document.querySelector('input[name="btnradio"]:checked');
    if (!radioChecked) return; // Sécurité si aucun bouton n'est coché
    
    const service = radioChecked.value;
    const itemTypeElem = document.getElementById('itemType');
    const type = itemTypeElem ? itemTypeElem.value : 'Document';

    // 2. Récupération des conteneurs avec vérification de présence (évite l'erreur NULL)
    const typeContainer = document.getElementById('typeContainer');
    const typeNat = document.getElementById('typeappelofre');
    const dimContainer = document.getElementById('dimensionsContainer');
    const btnFacture = document.getElementById('btnFactureContainer');

    // Fonction utilitaire interne pour masquer proprement
    const hide = (el) => { if (el) el.classList.add('d-none'); };
    const show = (el) => { if (el) el.classList.remove('d-none'); };

    // 3. Reset initial : On cache tout
    [typeContainer, typeNat, dimContainer, btnFacture].forEach(hide);

    // 4. Logique d'affichage
    if (service === 'EMS National') {
        show(typeNat);
    } 
    else if (service === 'EMS International' || service === 'RPPI') {
        show(typeContainer);
        
        if (type === 'Marchandise') {
            show(btnFacture); // Affiche le bouton pour le Modal Facture
            
            if (service === 'RPPI') {
                show(dimContainer); // Dimensions uniquement pour RPPI Marchandise
            }
        }
    }

    // Relancer le calcul du prix après changement de visibilité
    if (typeof calculerprix === "function") {
        calculerprix();
    }
}
// Fonction de calcul de prix
window.calculerprix = function() {
    const weight = parseFloat(document.getElementById('parcelWeight').value);
    const destination = document.getElementById('recCountry') ? document.getElementById('recCountry').value : 'Tunisie';
    
    // Validation
    if (isNaN(weight) || weight <= 0) {
        document.getElementById('pricezone').innerText = "";
        document.getElementById('parcelPrice').value = "0";
        return 0;
    }
    
    // Limite du test à 1kg
    if (weight > 1) {
        document.getElementById('pricezone').innerHTML = 
            '<span class="text-warning fw-bold">TEST : 0-1kg seulement</span>';
        document.getElementById('parcelPrice').value = "0";
        return 0;
    }
    
    // Définition claire des tarifs
    const TARIFS_TEST = {
        // [tarif_<0.5kg, tarif_0.5-1kg]
        'Tunisie': [5, 7],
        'Algeria': [39, 56],
        'Qatar': [39, 56],
        'France': [39, 65],
        'Canada': [51, 78],
        'Ukraine': [48, 77],
        'Brazil': [61, 83],
        'China': [60, 90],
        // Par défaut (autres pays) : EMS International
        'DEFAULT': [45, 65]
    };
    
    // Calcul
    const tarif = TARIFS_TEST[destination] || TARIFS_TEST['DEFAULT'];
    const price = weight < 0.5 ? tarif[0] : tarif[1];
    
    // CORRECTION IMPORTANTE : Mettre à jour l'affichage ET le champ caché
    const pricezone = document.getElementById('pricezone');
    const parcelPrice = document.getElementById('parcelPrice');
    
    if (pricezone) {
        pricezone.innerText = price.toFixed(3) + " DT";
    }
    
    if (parcelPrice) {
        parcelPrice.value = price.toFixed(3);
        console.log("Prix mis à jour dans champ caché:", parcelPrice.value);
    }
    
    return price;
};
function calculateLocalPrice(weight) {
    if (weight <= 0) return 0;
    
    const localPrices = [
        { max: 0.5, price: 5 },
        { max: 1, price: 7 },
        { max: 2, price: 9 },
        { max: 5, price: 10 },
        { max: 7, price: 12 },
        { max: 12, price: 14 },
        { max: 17, price: 20 },
        { max: 22, price: 25 },
        { max: 27, price: 30 },
        { max: 30, price: 35 }
    ];
    
    for (const range of localPrices) {
        if (weight <= range.max) {
            return range.price;
        }
    }
    
    return 0; // Pour poids > 30kg
}

function calculateInternationalPrice(weight, service, itemType, destination) {
    if (weight <= 0) return 0;
    
    // Calcul du poids volumétrique pour RPPI Marchandise
    if (service === 'RPPI' && itemType === 'Marchandise') {
        return calculateVolumetricPrice(weight, destination);
    }
    
    // Tarifs standards pour services internationaux
    const internationalTarifs = {
        'EMS National': { base: 7, kg: 1.5 },
        'EMS International': { base: 45, kg: 20 },
        'RPPI': { base: 18, kg: 10 },
        'Bouquet de fleurs': { base: 25, kg: 0 }
    };
    
    if (internationalTarifs[service]) {
        const t = internationalTarifs[service];
        return t.base + (weight * t.kg);
    }
    
    return 0;
}

function calculateVolumetricPrice(weight, destination) {
    const l = parseFloat(document.getElementById('longeur').value) || 0;
    const w = parseFloat(document.getElementById('largeur').value) || 0;
    const h = parseFloat(document.getElementById('hauteur').value) || 0;
    
    // Calcul du poids volumétrique
    const poidsVol = (l * w * h) / 5000;
    const effectiveWeight = Math.max(weight, poidsVol);
    
    // Tarifs par destination
    const destinationPrices = {
        "Algeria": [39, 56],
        "Qatar": [39, 56],
        "France": [39, 65],
        "Canada": [51, 78],
        "Ukraine": [48, 77],
        "Brazil": [61, 83],
        "China": [60, 90]
    };
    
    if (!destinationPrices[destination]) return 0;
    
    const [priceUnderHalf, priceUnderOne] = destinationPrices[destination];
    
    if (effectiveWeight < 0.5) {
        return priceUnderHalf;
    } else if (effectiveWeight < 1) {
        return priceUnderOne;
    } else {
        // Pour poids > 1kg, extrapoler
        return priceUnderOne + Math.floor(effectiveWeight) * 30;
    }
}

function updatePriceDisplay(price, weight, destination) {
    const zone = document.getElementById('pricezone');
    if (!zone) return;
    
    if (destination === 'Tunisie') {
        if (weight > 30) {
            zone.innerHTML = '<span class="text-danger">Max 30kg</span>';
        } else if (weight > 0) {
            zone.innerText = price.toFixed(3) + " DT";
        } else {
            zone.innerText = "";
        }
    } else {
        if (weight > 0 && price > 0) {
            zone.innerText = price.toFixed(3) + " DT";
        } else {
            zone.innerText = "";
        }
    }
}
function genererVueEtiquette(trackingId) {

    window.checkclient = function() {
        const tel = document.getElementById('senderTel').value;
        if (tel.length < 8) return; 

        fetch('/client/check/sender?tel=' + encodeURIComponent(tel))
        .then(res => {
            if (!res.ok) throw new Error("Erreur serveur");
                return res.json();
        })
        .then(data => {
            if (data && data.sendName) { 
                console.log("Expéditeur trouvé :", data);
                document.getElementById('senderName').value = data.sendName;
                document.getElementById('senderAdress').value = data.adress;
                document.getElementById('senderPostal').value = data.postalCode;
                document.getElementById('senderVille').value = data.city;
                document.getElementById('sendEmail').value = data.sendEmail || '';
                    document.getElementById('sendSocialReason').value = data.sendSocialReason || '';

                
                document.getElementById('senderName').classList.add('is-valid');
                setTimeout(() => document.getElementById('senderName').classList.remove('is-valid'), 2000);
                
                // Charger les colis non livrés de ce client
                loadClientParcels(tel);
            } else {
                console.log("Nouveau expéditeur (non trouvé)");
                document.getElementById('sessionContainer').style.display = 'none';
                document.querySelector('#sessionTable tbody').innerHTML = '';
                sessionTotal = 0;
                document.getElementById('totalSession').innerText = "0.000 DT";
                document.getElementById('colisCount').innerText = "0 Colis";
            }
        })
        .catch(err => console.error("Erreur fetch expéditeur:", err));
    };
    
    // Fonction pour charger les colis du client
    async function loadClientParcels(tel) {
        try {
            console.log("Chargement des colis pour le téléphone:", tel);
            
            const response = await fetch(`/client/check/parcel?tel=${encodeURIComponent(tel)}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const parcels = await response.json();
            console.log("Colis récupérés:", parcels);
            
            if (parcels && parcels.length > 0) {
                updateSessionTable(parcels);
                document.getElementById('sessionContainer').style.display = 'block';
            } else {
                document.getElementById('sessionContainer').style.display = 'none';
                document.querySelector('#sessionTable tbody').innerHTML = '';
                sessionTotal = 0;
                document.getElementById('totalSession').innerText = "0.000 DT";
                document.getElementById('colisCount').innerText = "0 Colis";
            }
            
        } catch (error) {
            console.error("Erreur lors du chargement des colis:", error);
            document.getElementById('sessionContainer').style.display = 'none';
        }
    }
    
    // Fonction pour mettre à jour le tableau de session
    function updateSessionTable(parcels) {
        const tbody = document.querySelector('#sessionTable tbody');
        tbody.innerHTML = '';
        
        let total = 0;
        let parcelCount = 0;
        
        parcels.forEach(parcel => {
            console.log("Traitement du colis:", parcel);
            
            // CORRECTION CRITIQUE: Le trackingNumber est un objet, pas une chaîne
            let trackingId = '';
            if (parcel.trackingNumber) {
                // Si trackingNumber a la méthode getFormattedParcelId()
                if (parcel.trackingNumber.formattedParcelId) {
                    trackingId = parcel.trackingNumber.formattedParcelId;
                }
                // Sinon, si c'est un objet avec parcelId, on le formate manuellement
                else if (parcel.trackingNumber.parcelId) {
                    trackingId = "EN" + String(parcel.trackingNumber.parcelId).padStart(9, '0') + "TN";
                }
                // Sinon, on essaie d'accéder directement aux propriétés
                else {
                    trackingId = JSON.stringify(parcel.trackingNumber); // Pour debug
                }
            } else if (parcel.trackingId) {
                trackingId = parcel.trackingId;
            } else if (parcel.id) {
                trackingId = "COLIS-" + parcel.id;
            }
            
            const receiverName = parcel.receiver ? 
                               (parcel.receiver.recName || parcel.receiver.fullName || '') : 
                               (parcel.receiverName || '');
            
            const weight = parcel.weight || parcel.poids || 0;
            const paymentMode = parcel.paymentMode || 
                              (parcel.modePaiement ? parcel.modePaiement : 'Espèces');
            const price = parcel.price || 
                         parcel.montant || 
                         (parcel.prix ? parseFloat(parcel.prix) : 0);
            
            const row = `
                <tr>
                    <td class="ps-4 fw-bold">${escapeHtml(trackingId)}</td>
                    <td>${escapeHtml(receiverName)}</td>
                    <td>${parseFloat(weight).toFixed(2)} KG</td>
                    <td><span class="badge bg-light text-dark border">${escapeHtml(paymentMode)}</span></td>
                    <td class="fw-bold text-primary">${parseFloat(price).toFixed(3)} DT</td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-secondary" 
                                onclick="window.open('/passenger/success?track=${escapeHtml(trackingId)}', '_blank', 'width=450,height=650')">
                            <i class="bi bi-printer"></i> Réimprimer
                        </button>
                    </td>
                </tr>`;
            
            tbody.insertAdjacentHTML('beforeend', row);
            total += parseFloat(price);
            parcelCount++;
        });
        
        // Mise à jour des totaux
        sessionTotal = total;
        document.getElementById('totalSession').innerText = total.toFixed(3) + " DT";
        document.getElementById('colisCount').innerText = parcelCount + " Colis";
    }
    
    // Fonction d'échappement HTML
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Fonction pour afficher des notifications
    function showNotification(message, type = 'info') {
        const alertClass = {
            'success': 'alert-success',
            'error': 'alert-danger',
            'info': 'alert-info',
            'warning': 'alert-warning'
        }[type] || 'alert-info';
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert ${alertClass} alert-dismissible fade show position-fixed`;
        alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        document.body.appendChild(alertDiv);
        
        // Auto-dismiss after 5 seconds
        setTimeout(() => {
            if (alertDiv.parentNode) {
                alertDiv.remove();
            }
        }, 5000);
    }

async function imprimerBordereauFinal() {
    const senderTel = document.getElementById('senderTel').value;
    const senderName = document.getElementById('senderName').value || 'Non spécifié';
    const senderAdress = document.getElementById('senderAdress').value || '';

    if (!senderTel) {
        alert("Veuillez d'abord saisir le numéro de téléphone de l'expéditeur");
        return;
    }

    try {
        // 1. Récupération des données JSON depuis le serveur
        const response = await fetch(`/client/check/parcel?validate=true&tel=${encodeURIComponent(senderTel)}&format=print`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) throw new Error('Erreur lors de la récupération des colis');

        const parcels = await response.json();
        
        if (parcels.length === 0) {
            alert("Aucun colis trouvé pour cet expéditeur.");
            return;
        }

        // 2. Préparation du contenu du tableau et calcul des totaux
        let tableRowsHtml = '';
        let totalGeneral = 0;
        let totalPoids = 0;

        parcels.forEach(parcel => {
            // Extraction du Tracking ID
            let trackingId = parcel.trackingNumber?.formattedParcelId || 
                             parcel.trackingId || 
                             (parcel.id ? "COLIS-" + parcel.id : "N/A");

            const receiverName = parcel.receiver?.recName || parcel.receiverName || 'Inconnu';
            const weight = parseFloat(parcel.weight || parcel.poids || 0);
            const price = parseFloat(parcel.price || parcel.montant || parcel.prix || 0);
            const paymentMode = parcel.paymentMode || parcel.modePaiement || 'Espèces';

            totalGeneral += price;
            totalPoids += weight;

            tableRowsHtml += `
                <tr>
                    <td>${escapeHtml(trackingId)}</td>
                    <td>${escapeHtml(receiverName)}</td>
                    <td class="text-center">${weight.toFixed(2)} KG</td>
                    <td class="text-center">${escapeHtml(paymentMode)}</td>
                    <td class="text-end">${price.toFixed(3)} DT</td>
                </tr>`;
        });

        // 3. Génération de la fenêtre d'impression
        const printWin = window.open('', '_blank', 'width=900,height=700');
        printWin.document.write(`
